<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clear Sight – Warteliste</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
<style>
/* Warteliste (F39): eigenes Fenster, das OBS NICHT aufnimmt. Gleicher Look wie das Stream-Fenster. */
:root{--bg:#1d2c47;--panel:#24375a;--panel2:#2c4470;--fg:#f4f1ea;--muted:#b9c3d6;--line:#41587f;
  --pro:#5ff0c0;--contra:#ff8c6b;--accent:#ffb347;--f:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.4}
.wrap{padding:16px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.leer{color:var(--muted);font-style:italic}
.status{font-size:13px;color:var(--muted)}
.v{background:var(--panel);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 0 0 1px var(--line)}
.kopf{display:flex;gap:8px;align-items:baseline}
.kopf .name{font-weight:700}
.kopf .zeit{color:var(--muted);font-size:13px}
.kopf .weg{margin-left:auto}
.text{font-size:16px;overflow-wrap:anywhere}
.ziel{font-size:13px;color:var(--muted)}
.ziel.fehlt{color:var(--accent)}
.zeile{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.arten{display:flex;border:1px solid var(--line);border-radius:22px;overflow:hidden}
.arten button{background:none;border:none;color:var(--muted);padding:5px 12px;font-size:14px}
.arten button[aria-pressed="true"]{background:var(--panel2);color:var(--fg)}
.arten button[data-art="pro"][aria-pressed="true"]{color:var(--pro)}
.arten button[data-art="contra"][aria-pressed="true"]{color:var(--contra)}
.arten button[data-art="einwand"][aria-pressed="true"]{color:var(--accent)}
.werte{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.werte button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 0;font-weight:700;font-size:14px}
.werte button:hover:not(:disabled){background:var(--accent);color:var(--bg)}
.werte button:disabled{opacity:.35;cursor:default}
.hinweisWert{font-size:12px;color:var(--muted)}
input,select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font:inherit;font-size:14px;min-width:0}
input{flex:1}
select{max-width:100%}
.nein{background:none;color:var(--muted);border:1px dashed var(--line);border-radius:22px;padding:4px 12px;font-size:13px}
.fehler{color:var(--accent);font-size:13px}
button:focus-visible,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="titel"></h1>
  <div class="status" id="status"></div>
  <div id="liste"></div>
</div>
<script src="rechnen.js"></script>
<script src="bearbeiten.js"></script>
<script src="chat.js"></script>
<script src="warteliste.js"></script>
</body>
</html>
